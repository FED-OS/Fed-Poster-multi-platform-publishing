# =============================================================================
# Option A (RECOMMENDED) — Electron on Windows, macOS, and Linux
# -----------------------------------------------------------------------------
# Drop-in replacement for your current .github/workflows/build.yml.
#
# Why this over a Tauri/macOS split:
#   Surf FED is a Chromium browser that loads Chrome MV3 extensions via
#   Electron's session.loadExtension() and renders pages with <webview> tags.
#   Neither exists in Tauri (which uses the system WebView: WebKit on macOS).
#   Moving only macOS to Tauri would break the entire extension system there.
#   Keeping Electron on all three platforms preserves full functionality.
#
# Triggers:
#   - push to main      -> build + upload artifact, no release
#   - manual run        -> build + upload artifact, no release
#   - pushing a v* tag  -> build + publish a GitHub Release
# =============================================================================

name: Build Desktop Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate-extensions:
    name: Validate built-in extensions
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate manifests
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d extensions/builtin ]; then
            echo "No builtin extensions folder found."
            exit 0
          fi
          ok=1
          for dir in extensions/builtin/*/; do
            if [ ! -f "${dir}manifest.json" ]; then
              echo "::error::Missing manifest.json in $dir"
              ok=0
              continue
            fi
            if ! node -e "JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8'))" 2>/dev/null; then
              echo "::error::Invalid JSON in ${dir}manifest.json"
              ok=0
              continue
            fi
            name=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).name || 'unknown')")
            ver=$(node -e "console.log(JSON.parse(require('fs').readFileSync('${dir}manifest.json', 'utf8')).version || '0')")
            echo "OK: $name v$ver ($dir)"
          done
          [ "$ok" = "1" ] || exit 1

  build:
    name: Electron (${{ matrix.name }})
    needs: validate-extensions
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            dist_flags: --win
            artifact_name: Surf-FED-Windows
            artifact_globs: |
              dist/*.exe
              dist/latest*.yml
          - name: macOS
            os: macos-14
            dist_flags: --mac
            artifact_name: Surf-FED-macOS
            artifact_globs: |
              dist/*.dmg
              dist/*.app
              dist/latest*.yml
          - name: Linux
            os: ubuntu-24.04
            dist_flags: --linux
            artifact_name: Surf-FED-Linux
            artifact_globs: |
              dist/*.AppImage
              dist/*.deb
              dist/*.snap
              dist/latest*.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ubuntu 24.04 uses libasound2t64 instead of the former libasound2.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xauth \
            libavcodec-extra \
            libgbm1 \
            libasound2t64

      - name: Build Electron package
        run: npm run dist -- ${{ matrix.dist_flags }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_globs }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \
            \( \
              -name '*.exe' -o \
              -name '*.dmg' -o \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.snap' -o \
              -name 'latest*.yml' \
            \) \
            -exec cp {} release/ \;
          echo "Release files:"
          ls -lah release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Surf FED ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
