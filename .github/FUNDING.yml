github: # fedpromptly          # uncomment + set GitHub Sponsors username when enabled
ko_fi: fedposter               # primary community tip jar — https://ko-fi.com/W3T61ZU5FS
# patreon:                     # uncomment if a Patreon is set up
# open_collective: fed-poster  # uncomment if an Open Collective is created
# buy_me_a_coffee:             # uncomment if a BMC is set up
# liberapay:                   # uncomment if a Liberapay is set up
# issuehunt: fed-poster        # uncomment to enable IssueHunt bounties
# lfx_crowdfunding:            # uncomment for LFX Crowdfunding
# community_bridge:            # uncomment for Community Bridge
# polar: fed-poster            # uncomment for Polar.sh issue funding
# tidelift:                    # uncomment for Tidelift
